[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mandol-substrate"
version = "0.1.0"
description = "Modality-independent SQLite truth and Qdrant projection publication"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["qdrant-client==1.19.0", "httpx>=0.27", "numpy==1.26.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mandol_substrate*"]

[tool.setuptools.package-data]
mandol_substrate = ["upstream.json"]
